<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">OpenMako Evidence Court social card</title>
  <desc id="desc">A coding agent claims success, the supplied evidence is checked, and Evidence Court returns FAIL.</desc>
  <rect width="1200" height="630" fill="#0f172a"/>
  <rect x="48" y="48" width="1104" height="534" rx="18" fill="#f8fafc"/>
  <text x="84" y="116" fill="#0f172a" font-family="Inter, Arial, sans-serif" font-size="44" font-weight="700">OpenMako Evidence Court</text>
  <text x="84" y="158" fill="#475569" font-family="Inter, Arial, sans-serif" font-size="24">Audit an agent success claim against the supplied run record.</text>

  <rect x="84" y="202" width="1032" height="94" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="116" y="240" fill="#075985" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700">CLAIM</text>
  <text x="116" y="274" fill="#0f172a" font-family="Inter, Arial, sans-serif" font-size="28">"Done. The calculator bug is fixed and tests pass."</text>

  <rect x="84" y="326" width="1032" height="118" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="116" y="364" fill="#9a3412" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700">SUPPLIED EVIDENCE</text>
  <text x="116" y="398" fill="#0f172a" font-family="Inter, Arial, sans-serif" font-size="26">edited protected path: tests/test_calculator.py</text>
  <text x="116" y="430" fill="#0f172a" font-family="Inter, Arial, sans-serif" font-size="26">required test not run: python -m pytest tests/test_calculator.py -q</text>

  <rect x="84" y="474" width="500" height="72" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="116" y="520" fill="#991b1b" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="800">VERDICT: FAIL</text>

  <text x="626" y="504" fill="#334155" font-family="Inter, Arial, sans-serif" font-size="22">v0.1.2 supports JSON run records, marked transcript v0,</text>
  <text x="626" y="536" fill="#334155" font-family="Inter, Arial, sans-serif" font-size="22">and explicit Evidence Court JSONL events.</text>
  <text x="84" y="586" fill="#64748b" font-family="Inter, Arial, sans-serif" font-size="18">Boundary: not native Claude/Codex/Cursor/Devin/CI log ingestion; does not prove tests ran outside the supplied record.</text>
</svg>
